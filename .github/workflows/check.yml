name: Check website and API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run build:azure
      - run: npm ci --prefix dist/backend --omit=dev --ignore-scripts
      - name: Load the packaged API
        run: node --input-type=module -e "await import('./dist/backend/api/functions.mjs')"
      - name: Validate Azure templates
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/coldline-infra.json
          az bicep build --file infra/gpu-workers.bicep --outfile /tmp/coldline-gpu.json
          az bicep build --file infra/defender.bicep --outfile /tmp/coldline-defender.json
      - uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-package
          path: dist/
