name: Deploy Azure production (manual)
on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Existing resource group for approved production resources
        required: true
        type: string
      name_prefix:
        description: Resource name prefix
        default: coldline
        type: string
      private_networking:
        description: Use private endpoints for tenant data and the API secret vault
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare private deployment parameters
        env:
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          COLDLINE_MEMBERSHIPS_JSON: ${{ secrets.COLDLINE_MEMBERSHIPS_JSON }}
          COLDLINE_ENQUIRY_HASH_SALT: ${{ secrets.COLDLINE_ENQUIRY_HASH_SALT }}
          COLDLINE_OWNER_USER_IDS: ${{ secrets.COLDLINE_OWNER_USER_IDS }}
          NAME_PREFIX: ${{ inputs.name_prefix }}
          PRIVATE_NETWORKING: ${{ inputs.private_networking }}
          OPENAI_ACCOUNT_NAME: ${{ vars.AZURE_OPENAI_ACCOUNT_NAME }}
          OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          DOCUMENT_ACCOUNT_NAME: ${{ vars.AZURE_DOCUMENT_INTELLIGENCE_ACCOUNT_NAME }}
          COLDLINE_VISION_ENDPOINT: ${{ vars.COLDLINE_VISION_ENDPOINT }}
          COLDLINE_INFERENCE_HOST: ${{ vars.COLDLINE_INFERENCE_HOST }}
        run: node scripts/deployment-parameters.mjs "$RUNNER_TEMP/coldline-parameters.json"
      - name: Provision infrastructure
        id: infrastructure
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
        run: |
          az deployment group create --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep --parameters "@$RUNNER_TEMP/coldline-parameters.json" --output json > "$RUNNER_TEMP/coldline-deployment.json"
          node scripts/deployment-outputs.mjs "$RUNNER_TEMP/coldline-deployment.json" >> "$GITHUB_OUTPUT"
      - name: Link and verify API authentication before enabling HTTP requests
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          SITE_NAME: ${{ steps.infrastructure.outputs.staticSiteName }}
          FUNCTION_ID: ${{ steps.infrastructure.outputs.functionAppId }}
        run: |
          az staticwebapp functions link --name "$SITE_NAME" --resource-group "$RESOURCE_GROUP" --function-resource-id "$FUNCTION_ID" --output none
          az rest --method get --url "https://management.azure.com$FUNCTION_ID/config/authsettingsV2?api-version=2024-04-01" > "$RUNNER_TEMP/coldline-auth.json"
          node scripts/verify-linked-auth.mjs "$RUNNER_TEMP/coldline-auth.json"
      - name: Build for the provisioned origin
        env:
          COLDLINE_RUNTIME_ORIGIN: ${{ steps.infrastructure.outputs.origin }}
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npm run build:azure && npm ci --prefix dist/backend --omit=dev --ignore-scripts
      - name: Publish backend package
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          FUNCTION_NAME: ${{ steps.infrastructure.outputs.functionAppName }}
        run: |
          (cd dist/backend && zip -qr "$RUNNER_TEMP/coldline-api.zip" .)
          az functionapp deployment source config-zip --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_NAME" --src "$RUNNER_TEMP/coldline-api.zip" --output none
          az functionapp config appsettings set --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_NAME" --settings 'AzureWebJobs.workspace.Disabled=false' --output none
      - name: Obtain frontend deployment token
        id: token
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          SITE_NAME: ${{ steps.infrastructure.outputs.staticSiteName }}
        run: |
          DEPLOY_TOKEN=$(az staticwebapp secrets list --name "$SITE_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)
          echo "::add-mask::$DEPLOY_TOKEN"
          echo "value=$DEPLOY_TOKEN" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: dist/site
          api_location: ''
          skip_app_build: true
          skip_api_build: true
      - name: Remove temporary secret files
        if: always()
        run: rm -f "$RUNNER_TEMP/coldline-parameters.json" "$RUNNER_TEMP/coldline-deployment.json" "$RUNNER_TEMP/coldline-auth.json"
